[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-data-process"
version = "0.1.0"
description = "Convert SWE-bench agent trajectories into LLaMA-Factory SFT training data."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "tqdm>=4.60",
    "transformers>=4.40",
    "openpyxl>=3.1",
    "datasets>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-q"]
markers = ["slow: tests requiring tokenizers or large fixtures"]

[tool.setuptools.packages.find]
where = ["src"]
